name: Build APK

on:
  push:
    branches: [main, master]
    # v1.2.3 与 1.2.3 两种 tag 写法都支持
    tags: ['v*', '*.*.*']
  pull_request:
  workflow_dispatch:

# 打 tag 时需要创建 Release，因此需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 整个任务跑在容器里：镜像自带 JDK 21，Android CLI 由官方脚本在容器内安装。
    # 不依赖 runner 预装的 SDK / cmdline-tools（里面的 sdkmanager 已废弃且不含 android 二进制）。
    container:
      image: eclipse-temurin:21-jdk
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      # 容器基础镜像很精简：git 供 checkout，curl 供 Android CLI 安装脚本，
      # make/awk 供 Makefile 使用（temurin 镜像里没有 make）
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make mawk

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 缓存 SDK 组件（约 400MB）。key 里带上组件版本，改版本时自动失效。
      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-platform36-buildtools35.0.0

      # sdkmanager 已废弃，官方替代品是 Android CLI
      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          # 命中缓存时这里是秒过的 no-op
          android --sdk="$ANDROID_HOME" sdk install \
            platforms/android-36 platform-tools build-tools/35.0.0
          android --sdk="$ANDROID_HOME" sdk list

          # android sdk install 对不存在的包只打印提示、退出码仍为 0，这里显式校验
          for pkg in platforms/android-36 platform-tools build-tools/35.0.0; do
            android --sdk="$ANDROID_HOME" sdk list "$pkg" | grep -q "$pkg" \
              || { echo "::error::$pkg 未安装成功"; exit 1; }
          done

      # 缓存 Gradle 依赖，避免每次重新下载 AGP 与 AndroidX
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 配置了签名 secrets 时还原密钥库，产物即为已签名 release APK；
      # 未配置则跳过，产出未签名 release APK。
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
          fi

      - name: Build Debug APK
        if: ${{ github.ref_type != 'tags' }}
        run: make apk-debug

      # 打 tag 时版本号取 tag（去掉可能的前缀 v），覆盖 package.json 中的版本
      - name: Build Release APK
        if: ${{ github.ref_type == 'tags' }}
        run: make apk-release VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: release/*.apk
          if-no-files-found: error

      # 该步骤产生 repo 的 Releases 页面条目；未打 tag 时不会执行
      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tags' }}
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
